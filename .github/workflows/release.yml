name: Выпуск Хвои

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Зависимости
        run: npm ci
      - name: Тесты
        run: npm test
      - name: Проверить, выпущена ли уже эта версия
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> $GITHUB_OUTPUT
          if gh release view "v$V" >/dev/null 2>&1; then echo "exists=true" >> $GITHUB_OUTPUT; else echo "exists=false" >> $GITHUB_OUTPUT; fi
      - name: Сборка и выпуск
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npx electron-builder --win --x64 --publish always

  # Телефонная версия тем же выпуском. Отдельной работой и после компьютерной:
  # упавшая сборка apk не должна портить уже состоявшийся выпуск для Windows.
  android:
    needs: release
    uses: ./.github/workflows/android.yml
    secrets: inherit
