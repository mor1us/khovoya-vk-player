name: Хвоя для телефона

# apk кладётся в тот же выпуск, что и установщик для Windows, — но отдельной работой, после него.
# Если сборка apk упадёт, компьютерный выпуск уже состоялся и не пострадает.
# Запускается сам после выпуска, а при желании и руками: вкладка Actions,
# «Хвоя для телефона», кнопка «Run workflow» — так можно доложить apk и в старый выпуск.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Выпуск, в который положить apk (пусто — текущая версия из package.json)
        required: false
        default: ''
  workflow_call:
    inputs:
      release:
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Зависимости
        run: npm ci
      - name: Проверки
        run: npm run check
      - name: Куда класть
        id: ver
        run: |
          V="${{ inputs.release }}"
          [ -z "$V" ] && V="v$(node -p "require('./package.json').version")"
          echo "tag=$V" >> $GITHUB_OUTPUT
          echo "name=Khvoya-${V#v}.apk" >> $GITHUB_OUTPUT
      - name: Ключ подписи, если он заведён
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          # ключа может не быть — тогда apk подпишется отладочным, но соберётся
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/khvoya.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/khvoya.jks" >> $GITHUB_ENV
          fi
      - name: Сборка apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm run build:mobile
          cd android && ./gradlew assembleRelease
      - name: Положить apk в выпуск
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "${{ steps.ver.outputs.name }}"
          gh release upload "${{ steps.ver.outputs.tag }}" "${{ steps.ver.outputs.name }}" --clobber
