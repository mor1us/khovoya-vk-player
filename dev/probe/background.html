<!doctype html>
<!-- ВЫБРАСЫВАЕМЫЙ КОД: проверяет, переживёт ли звук в WebView погашенный экран. -->
<html lang="ru">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Проверка фона</title>
<style>body{background:#0B0B0B;color:#F5F5F5;font:16px system-ui;padding:24px}button{background:#39FF14;color:#0B0B0B;border:0;padding:16px 24px;font-size:18px;border-radius:8px}p{color:#A8A8A8}#t{font:28px monospace;color:#39FF14}</style>
</head>
<body>
<h1>Проверка фона</h1>
<button id="go">Играть</button>
<p id="t">0.0</p>
<p>Гасим экран на минуту. Если счётчик дальше идёт и звук слышно — фон держится.</p>
<p><a href="app.html" style="color:#39FF14">Открыть Хвою →</a></p>
<audio id="a" loop src="tone.mp3"></audio>
<script>
  const a = document.getElementById('a'), t = document.getElementById('t')
  document.getElementById('go').onclick = () => { a.play(); setInterval(() => { t.textContent = a.currentTime.toFixed(1) }, 200) }
</script>
</body>
</html>
